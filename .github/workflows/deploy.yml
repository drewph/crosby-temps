name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # 06:15 UTC daily, after Open-Meteo has published the previous day.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "Year to backfill (leave empty for the current year)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Record the daily snapshot
        if: github.event_name != 'push'
        env:
          SNAPSHOT_YEAR: ${{ inputs.year }}
        run: |
          if [ -n "$SNAPSHOT_YEAR" ]; then
            node scripts/snapshot.mjs --year="$SNAPSHOT_YEAR"
          else
            node scripts/snapshot.mjs
          fi

      - name: Commit the snapshot
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- public/data; then
            echo "Snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Update temperature snapshot"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
