name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Experiment 2026-10-27..30: probe scheduler delay and archive availability.
    # Keep 06:15 as the baseline. Review actual start times, which slot first
    # commits, and whether early runs freeze values that later change.
    - cron: "15 0 * * *"
    - cron: "15 2 * * *"
    - cron: "15 4 * * *"
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "Year to backfill (leave empty for the current year)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Record the daily snapshot
        if: github.event_name != 'push'
        env:
          SNAPSHOT_YEAR: ${{ inputs.year }}
        run: |
          if [ -n "$SNAPSHOT_YEAR" ]; then
            node scripts/snapshot.mjs --year="$SNAPSHOT_YEAR"
          else
            node scripts/snapshot.mjs
          fi

      - name: Commit the snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Snapshot already current."
            exit 0
          fi
          git commit -m "Update temperature snapshot"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke test the deployed site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$url" | grep -q "Crosby Temperatures"; then
              echo "Deployed page responded at $url"
              exit 0
            fi
            echo "Attempt $attempt did not return the expected page; retrying in 5 seconds."
            sleep 5
          done
          echo "Deployed page did not return the expected content."
          exit 1
