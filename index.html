<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crosby Temperatures</title>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="location">
          <div class="eyebrow">Daily temperatures</div>
          <div class="title-row">
            <img id="site-logo" class="site-logo" alt="Isle of Man crochet weather logo" />
            <h1 id="location-name"></h1>
          </div>
          <p class="coordinates" id="coordinates"></p>
          <p class="last-updated" id="last-updated"></p>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </header>

      <main>
        <div class="controls" aria-label="Data controls">
          <div class="range-buttons" role="group" aria-label="Quick ranges">
            <button class="range-button active" data-range="7" type="button">Last 7</button>
            <button class="range-button" data-range="30" type="button">Last 30</button>
            <button class="range-button" data-range="60" type="button">Last 60</button>
          </div>
          <div class="view-toggle" role="group" aria-label="View mode">
            <button class="view-button active" data-view="list" type="button">List</button>
            <button class="view-button" data-view="calendar" type="button">Calendar</button>
          </div>
        </div>

        <section class="moon-card" aria-labelledby="moon-title">
          <div class="moon-card__header">
            <div>
              <p class="moon-card__eyebrow">Moon phases</p>
              <h2 id="moon-title">Moon outlook</h2>
            </div>
            <p class="moon-card__meta" id="moon-source"></p>
          </div>
          <div class="moon-grid">
            <article class="moon-stat">
              <span class="moon-stat__label">Current phase</span>
              <strong class="moon-stat__value" id="moon-phase">Loading…</strong>
              <span class="moon-stat__subtext" id="moon-illumination"></span>
            </article>
            <article class="moon-stat moon-stat--highlight">
              <span class="moon-stat__label">Next full moon</span>
              <strong class="moon-stat__value" id="next-full-moon">Loading…</strong>
              <span class="moon-stat__subtext" id="next-full-moon-countdown"></span>
            </article>
          </div>
        </section>

        <section class="data-card" id="list-view">
          <div class="table-wrapper">
            <table id="temperatures" aria-live="polite">
              <thead>
                <tr>
                  <th scope="col">Date</th>
                  <th scope="col" class="col-square">Square</th>
                  <th scope="col" class="col-temp">Max (°C)</th>
                  <th scope="col" class="col-temp">Min (°C)</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div id="card-list" class="card-list" aria-live="polite"></div>
        </section>

        <section class="data-card hidden" id="calendar-view" aria-live="polite"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
